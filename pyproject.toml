[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-arbitrage-platform"
version = "0.1.0"
description = "Battery dispatch optimization across multiple electricity markets"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=2.0",
    "pulp[cbc]>=3.3,<4",
    "highspy>=1.10",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.35"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
